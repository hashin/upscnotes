<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UPSC Notes</title>
  <!--
    SPA fallback for static hosts (GitHub Pages). Turns /alice/some-note into
    /?/alice/some-note and reloads; index.html restores the real path before the app boots.
    Custom domain serves at root, so pathSegmentsToKeep = 0.
  -->
  <script>
    (function () {
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body></body>
</html>
