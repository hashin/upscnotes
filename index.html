<!doctype html>
<html lang="en" data-theme="sepia">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>UPSC Notes — offline markdown notes for civil services preparation</title>
  <meta name="description" content="A free, offline-first markdown notes app for UPSC preparation. Write GS and optional notes, sync to your own Google Drive, and share them at upscnotes.hashin.me/your-name." />

  <meta property="og:title" content="UPSC Notes" />
  <meta property="og:description" content="Offline-first markdown notes for UPSC preparation, synced to your Google Drive." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://upscnotes.hashin.me/" />
  <meta property="og:image" content="https://upscnotes.hashin.me/og.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    /* Restore the real path after a static-host SPA redirect (see public/404.html). */
    (function () {
      var l = window.location;
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })();
  </script>
</head>
<body>
  <div id="app" aria-busy="true">
    <div class="boot">
      <div class="boot-mark">UPSC&nbsp;Notes</div>
      <div class="boot-hint">Loading your workspace…</div>
      <noscript>This app needs JavaScript. Your notes are still safe — they live in this browser and in your Google Drive.</noscript>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
