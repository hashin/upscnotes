# Standalone Cloudflare Worker for the username registry.
# Deploy:  cd worker && npx wrangler deploy
# The static site lives on GitHub Pages; this is the only server component.

name = "upscnotes-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "upscnotes"
database_id = "PASTE_D1_DATABASE_ID"   # from: npx wrangler d1 create upscnotes

# GOOGLE_CLIENT_ID (the OAuth Web client id — public, not a secret) is read from env.
# Set it with:  npx wrangler secret put GOOGLE_CLIENT_ID
# or uncomment and inline it here:
# [vars]
# GOOGLE_CLIENT_ID = "xxxx.apps.googleusercontent.com"
