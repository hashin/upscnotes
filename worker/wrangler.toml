# Standalone Cloudflare Worker for the username registry.
# Deploy:  cd worker && npx wrangler deploy
# The static site lives on GitHub Pages; this is the only server component.

name = "upscnotes-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "upscnotes"
database_id = "eff788d9-d423-464c-9a14-7817b0181b05"

# GOOGLE_CLIENT_ID is the OAuth Web client id — public (it ships in the frontend bundle),
# not a secret — so it lives here in plain [vars].
[vars]
GOOGLE_CLIENT_ID = "157486155350-8qsefn3gudhk8f5co0hbmki6243b86nq.apps.googleusercontent.com"
